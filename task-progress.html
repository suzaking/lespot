<!doctype html>
<html lang="ja">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="color-scheme" content="light dark" />
    <title>LeSpot 開発進捗</title>
    <style>
      :root {
        color-scheme: light dark;
        font-family: system-ui, 'Yu Gothic UI', sans-serif;
        font-synthesis: none;
        line-height: 1.55;
        --page: #f5f6f8;
        --surface: #fff;
        --ink: #20242b;
        --muted: #59616d;
        --line: #dfe3e8;
        --accent: #286653;
        --accent-soft: #e7f2ed;
        --pending: #875800;
        --pending-soft: #fff1cd;
        --waiting: #465875;
        --waiting-soft: #eaf0fa;
        --error: #9f2f32;
      }

      @media (prefers-color-scheme: dark) {
        :root {
          --page: #16191d;
          --surface: #20252b;
          --ink: #f2f4f6;
          --muted: #bdc4ce;
          --line: #3a424b;
          --accent: #82c6a9;
          --accent-soft: #263a32;
          --pending: #f2c76e;
          --pending-soft: #44381f;
          --waiting: #aec4ec;
          --waiting-soft: #29354a;
          --error: #ff9a9e;
        }
      }

      * {
        box-sizing: border-box;
      }
      body {
        margin: 0;
        background: var(--page);
        color: var(--ink);
      }
      main {
        width: min(100% - 32px, 920px);
        margin: 0 auto;
        padding: 32px 0 56px;
      }
      header {
        display: flex;
        align-items: flex-start;
        justify-content: space-between;
        gap: 20px;
        flex-wrap: wrap;
      }
      h1,
      h2,
      p {
        margin: 0;
      }
      h1 {
        font-size: clamp(1.6rem, 4vw, 2.15rem);
        line-height: 1.2;
      }
      h2 {
        font-size: 1.15rem;
        margin-bottom: 14px;
      }
      .muted {
        color: var(--muted);
      }
      .header-meta {
        display: grid;
        gap: 6px;
        color: var(--muted);
        font-size: 0.9rem;
        text-align: right;
      }
      button {
        min-height: 42px;
        padding: 8px 14px;
        border: 1px solid var(--line);
        border-radius: 10px;
        background: var(--surface);
        color: var(--ink);
        font: inherit;
        cursor: pointer;
      }
      button:hover {
        border-color: var(--accent);
      }
      button:focus-visible {
        outline: 3px solid var(--accent);
        outline-offset: 2px;
      }
      button:disabled {
        opacity: 0.65;
        cursor: wait;
      }
      .statusline {
        min-height: 1.5em;
        margin-top: 10px;
        color: var(--muted);
        font-size: 0.9rem;
      }
      .statusline.error {
        color: var(--error);
      }
      .overview {
        margin-top: 24px;
        padding: 20px;
        border: 1px solid var(--line);
        border-radius: 16px;
        background: var(--surface);
      }
      .overview-top {
        display: flex;
        justify-content: space-between;
        gap: 16px;
        align-items: baseline;
        flex-wrap: wrap;
      }
      .count {
        font-size: 1.35rem;
        font-weight: 700;
      }
      .progress-track {
        height: 10px;
        margin-top: 14px;
        overflow: hidden;
        border-radius: 99px;
        background: var(--line);
      }
      .progress-fill {
        height: 100%;
        width: 0;
        border-radius: inherit;
        background: var(--accent);
        transition: width 250ms ease;
      }
      .summary {
        display: grid;
        grid-template-columns: repeat(3, minmax(0, 1fr));
        gap: 10px;
        margin-top: 16px;
      }
      .summary-item {
        padding: 12px;
        border-radius: 12px;
        background: var(--page);
      }
      .summary-item strong {
        display: block;
        font-size: 1.1rem;
      }
      .summary-item span {
        color: var(--muted);
        font-size: 0.85rem;
      }
      section {
        margin-top: 28px;
      }
      .task-list {
        display: grid;
        gap: 8px;
        padding: 0;
        margin: 0;
        list-style: none;
      }
      .task {
        display: grid;
        grid-template-columns:
          58px minmax(150px, 1.1fr) minmax(110px, auto)
          minmax(140px, 1fr);
        align-items: start;
        gap: 12px;
        padding: 12px 14px;
        border: 1px solid var(--line);
        border-radius: 12px;
        background: var(--surface);
      }
      .task-id {
        color: var(--muted);
        font-variant-numeric: tabular-nums;
      }
      .task-name {
        font-weight: 600;
      }
      .task-detail {
        color: var(--muted);
        font-size: 0.9rem;
      }
      .badge {
        width: fit-content;
        padding: 2px 9px;
        border-radius: 99px;
        font-size: 0.85rem;
        font-weight: 600;
        white-space: nowrap;
      }
      .badge.done {
        background: var(--accent-soft);
        color: var(--accent);
      }
      .badge.staged {
        background: var(--pending-soft);
        color: var(--pending);
      }
      .badge.not-run,
      .badge.blocked,
      .badge.other {
        background: var(--waiting-soft);
        color: var(--waiting);
      }
      .next-card,
      .current-card {
        padding: 18px;
        border: 1px solid var(--line);
        border-radius: 14px;
        background: var(--surface);
      }
      .next-card {
        border-left: 5px solid var(--accent);
      }
      .next-card p + p,
      .current-card p + p {
        margin-top: 10px;
      }
      .next-card strong {
        color: var(--accent);
      }
      .source-links {
        display: flex;
        flex-wrap: wrap;
        gap: 16px;
        margin-top: 24px;
        font-size: 0.9rem;
      }
      a {
        color: var(--accent);
      }
      @media (max-width: 640px) {
        main {
          width: min(100% - 24px, 920px);
          padding-top: 22px;
        }
        .header-meta {
          text-align: left;
        }
        .summary {
          grid-template-columns: 1fr;
        }
        .task {
          grid-template-columns: 54px minmax(0, 1fr);
          gap: 5px 10px;
        }
        .task-badge {
          grid-column: 2;
        }
        .task-detail {
          grid-column: 2;
        }
      }
      @media (prefers-reduced-motion: reduce) {
        .progress-fill {
          transition: none;
        }
      }
    </style>
  </head>
  <body>
    <main>
      <header>
        <div>
          <h1>LeSpot 開発進捗</h1>
          <p class="muted">タスクの正本を読み込んで表示します</p>
        </div>
        <div class="header-meta">
          <button id="refresh" type="button">今すぐ更新</button>
          <span id="updated" aria-live="polite">読み込み前</span>
        </div>
      </header>
      <p id="load-status" class="statusline" role="status" aria-live="polite">
        TASKS.mdとNEXT_WORK.mdを読み込んでいます…
      </p>

      <section class="overview" aria-labelledby="overview-title">
        <div class="overview-top">
          <h2 id="overview-title">全体の進捗</h2>
          <p id="progress-label" class="count">—</p>
        </div>
        <div
          id="progress"
          class="progress-track"
          role="progressbar"
          aria-label="完了タスクの割合"
          aria-valuemin="0"
          aria-valuemax="100"
          aria-valuenow="0"
        >
          <div id="progress-fill" class="progress-fill"></div>
        </div>
        <div class="summary">
          <div class="summary-item">
            <strong id="done-count">—</strong><span>完了</span>
          </div>
          <div class="summary-item">
            <strong id="open-count">—</strong><span>未完了・保留中</span>
          </div>
          <div class="summary-item">
            <strong id="source-date">—</strong><span>TASKS.mdの更新日</span>
          </div>
        </div>
      </section>

      <section aria-labelledby="tasks-title">
        <h2 id="tasks-title">タスク一覧</h2>
        <ul id="tasks" class="task-list"></ul>
      </section>

      <section aria-labelledby="next-title">
        <h2 id="next-title">次にやること</h2>
        <div id="next-work" class="next-card"><p>読み込み中…</p></div>
      </section>

      <section aria-labelledby="current-title">
        <h2 id="current-title">直近の確認状態</h2>
        <div id="current-state" class="current-card"><p>読み込み中…</p></div>
      </section>

      <nav class="source-links" aria-label="元の進捗ファイル">
        <a href="/TASKS.md">TASKS.mdを開く</a>
        <a href="/NEXT_WORK.md">NEXT_WORK.mdを開く</a>
        <a href="/AI_WORK_STATE.md">AI_WORK_STATE.mdを開く</a>
      </nav>
    </main>
    <script type="module">
      const taskList = document.querySelector('#tasks');
      const loadStatus = document.querySelector('#load-status');
      const refreshButton = document.querySelector('#refresh');

      function plainMarkdown(value) {
        return value
          .replace(/\[([^\]]+)\]\([^)]+\)/g, '$1')
          .replace(/`([^`]+)`/g, '$1')
          .replace(/\*\*/g, '')
          .trim();
      }

      function statusFor(rawStatus) {
        const normalized = rawStatus.trim().toUpperCase();
        if (normalized.includes('DONE'))
          return { label: '完了', className: 'done', done: true };
        if (normalized.includes('STAGED'))
          return { label: '登録待ち', className: 'staged', done: false };
        if (normalized.includes('NOT_RUN'))
          return { label: '未実施', className: 'not-run', done: false };
        if (normalized.includes('BLOCKED'))
          return { label: '保留', className: 'blocked', done: false };
        return { label: '確認要', className: 'other', done: false };
      }

      function taskFromRow(line) {
        const cells = line.match(
          /^\|\s*(I-\d+)\s*\|\s*(.*?)\s*\|\s*(.*?)\s*\|$/,
        );
        if (!cells) return null;
        const [, id, name, rawStatus] = cells;
        const status = statusFor(rawStatus);
        const detail = rawStatus
          .replace(/^(DONE|STAGED|NOT_RUN|BLOCKED)\s*[:：]?\s*/i, '')
          .trim();
        return {
          id,
          name: plainMarkdown(name),
          detail: plainMarkdown(detail),
          ...status,
        };
      }

      function element(tag, className, text) {
        const node = document.createElement(tag);
        if (className) node.className = className;
        if (text) node.textContent = text;
        return node;
      }

      function renderTasks(tasks) {
        taskList.replaceChildren();
        for (const task of tasks) {
          const row = element('li', 'task');
          row.append(element('span', 'task-id', task.id));
          row.append(element('span', 'task-name', task.name));
          const badge = element(
            'span',
            `badge task-badge ${task.className}`,
            task.label,
          );
          row.append(badge);
          row.append(element('span', 'task-detail', task.detail || '—'));
          taskList.append(row);
        }
      }

      function renderNextWork(markdown, tasks) {
        const box = document.querySelector('#next-work');
        box.replaceChildren();
        const handoff =
          markdown.match(
            /^## Current handoff[^\r\n]*\r?\n([\s\S]*?)(?=^## |$(?![\s\S]))/m,
          )?.[1] ?? '';
        const next = handoff.match(/^Next work is ([^.]+)\./m)?.[1];
        if (next) {
          const task = next
            .replace(/^manual device QA:\s*/i, '')
            .replace(
              'iOS Safari and Android Chrome',
              'iOS Safari／Android Chrome',
            )
            .replace('allowed/denied real GPS', '実GPSの許可／拒否')
            .replace(
              'real OpenFreeMap roads-only rendering and attribution',
              'OpenFreeMap道路のみの実表示と出典',
            )
            .replace(
              'touch/keyboard/screen-reader behavior',
              'タッチ／キーボード／読み上げ操作',
            )
            .replaceAll(', ', '、');
          const line = element('p', '');
          const nextTask = tasks.find((item) => !item.done);
          if (nextTask) {
            line.append(
              element('strong', '', `${nextTask.id} — ${nextTask.name}: `),
            );
          }
          line.append(document.createTextNode(task));
          box.append(line);
        } else {
          box.append(
            element(
              'p',
              '',
              'NEXT_WORK.mdのCurrent handoffに次の作業が見つかりません。',
            ),
          );
        }

        if (/staged bench records/i.test(handoff)) {
          box.append(
            element(
              'p',
              'muted',
              'ベンチ情報の本番反映は、管理者のバックアップと安全なキー入力後に行います。',
            ),
          );
        }
      }

      function renderCurrentState(markdown, tasks) {
        const box = document.querySelector('#current-state');
        box.replaceChildren();
        const handoff =
          markdown.match(
            /^## Current handoff[^\r\n]*\r?\n([\s\S]*?)(?=^## |$(?![\s\S]))/m,
          )?.[1] ?? '';
        const browserPass = handoff.match(
          /(\d+) Playwright tests on desktop, (\d+px) mobile, and (\d+px) narrow viewports/,
        );
        const summary = browserPass
          ? `最新UIのブラウザ確認：${browserPass[1]}件成功（PC、幅${browserPass[2]}、幅${browserPass[3]}）。`
          : `最新UIの確認状況：${tasks.find((task) => task.id === 'I-13')?.detail || 'TASKS.mdを参照'}。`;
        box.append(element('p', '', summary));
        if (/deliberately stubbed\/blocked/i.test(handoff)) {
          box.append(
            element(
              'p',
              'muted',
              '地図タイルとスポットAPIはテスト用に置き換えています。実タイルと本番APIの確認は未実施です。',
            ),
          );
        }
      }

      async function refresh() {
        refreshButton.disabled = true;
        loadStatus.classList.remove('error');
        loadStatus.textContent = '最新の進捗を読み込んでいます…';
        try {
          const stamp = `?refresh=${Date.now()}`;
          const [tasksResponse, nextResponse] = await Promise.all([
            fetch(`/TASKS.md${stamp}`, { cache: 'no-store' }),
            fetch(`/NEXT_WORK.md${stamp}`, { cache: 'no-store' }),
          ]);
          if (!tasksResponse.ok || !nextResponse.ok)
            throw new Error('進捗ファイルを読み込めませんでした');
          const [tasksMarkdown, nextMarkdown] = await Promise.all([
            tasksResponse.text(),
            nextResponse.text(),
          ]);
          const tasks = tasksMarkdown
            .split(/\r?\n/)
            .map(taskFromRow)
            .filter(Boolean);
          if (tasks.length === 0)
            throw new Error('TASKS.mdからタスク表を読み取れませんでした');

          const done = tasks.filter((task) => task.done).length;
          const open = tasks.length - done;
          const percent = Math.round((done / tasks.length) * 100);
          const updateDate =
            tasksMarkdown.match(/^更新：?\s*(\d{4}-\d{2}-\d{2})/m)?.[1] ??
            '記載なし';
          document.querySelector('#progress-label').textContent =
            `${done}/${tasks.length}件（${percent}%）`;
          document.querySelector('#done-count').textContent = `${done}件`;
          document.querySelector('#open-count').textContent = `${open}件`;
          document.querySelector('#source-date').textContent = updateDate;
          document
            .querySelector('#progress')
            .setAttribute('aria-valuenow', String(percent));
          document.querySelector('#progress-fill').style.width = `${percent}%`;
          renderTasks(tasks);
          renderNextWork(nextMarkdown, tasks);
          renderCurrentState(nextMarkdown, tasks);
          document.querySelector('#updated').textContent =
            `最終読込：${new Intl.DateTimeFormat('ja-JP', { hour: '2-digit', minute: '2-digit', second: '2-digit' }).format(new Date())}`;
          loadStatus.textContent =
            '最新のTASKS.md／NEXT_WORK.mdを表示中です。1分ごとに自動更新します。';
        } catch (error) {
          loadStatus.classList.add('error');
          loadStatus.textContent = `${error.message}。ページをViteのローカルサーバーから開いてください。`;
        } finally {
          refreshButton.disabled = false;
        }
      }

      refreshButton.addEventListener('click', refresh);
      refresh();
      window.setInterval(refresh, 60_000);
    </script>
  </body>
</html>
